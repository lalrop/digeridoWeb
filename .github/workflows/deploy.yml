name: verificar y desplegar

# §11, criterio de salida de la Fase 0: "un push a `main` publica en producción
# en menos de 3 minutos".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Un push nuevo cancela el anterior: no tiene sentido desplegar un commit
  # viejo porque su job arrancó primero.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  # ── Los datos primero: si el pipeline miente, el sitio no importa ────────
  pipeline:
    name: tests de pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: instalar
        run: pip install -e '.[dev]'

      - name: ruff
        run: ruff check pipelines

      - name: invariantes de los datos
        run: pytest pipelines -q

  # ── Front: tipos, tests y presupuesto de rendimiento ────────────────────
  web:
    name: build y presupuesto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: instalar
        run: pnpm install --frozen-lockfile

      - name: tokens
        run: pnpm -F @digerido/tokens build

      # La paleta se verifica contra deuteranopía y protanopía acá: si alguien
      # agrega un color que no se distingue, el merge se bloquea (§8).
      - name: tests
        run: pnpm -r test

      - name: typecheck
        run: pnpm -r typecheck

      - name: build
        run: pnpm -F @digerido/web build

      # Falla el CI si se excede el presupuesto de §8.
      - name: presupuesto de rendimiento
        run: pnpm presupuesto

      - name: guardar sitio
        uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: apps/web/dist
          retention-days: 3

  # ── Lighthouse: LCP y CLS, que solo se miden ejecutando ─────────────────
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sitio
          path: apps/web/dist

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: lighthouse ci
        run: npx --yes @lhci/cli@0.14.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # ── Despliegue: rsync con releases y symlink atómico (§9) ───────────────
  desplegar:
    name: desplegar al VPS
    runs-on: ubuntu-latest
    needs: [pipeline, web, lighthouse]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: produccion
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sitio
          path: dist

      - name: configurar ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_CLAVE_PRIVADA }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Host key fijado en un secret: `StrictHostKeyChecking=no` acepta
          # cualquier servidor que responda, y es una puerta abierta a MITM.
          echo "${{ secrets.SSH_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: subir release
        env:
          DESTINO: ${{ secrets.SSH_USUARIO }}@${{ secrets.SSH_HOST }}
          RAIZ: /var/www/digerido
        run: |
          set -euo pipefail
          RELEASE="$RAIZ/releases/${{ github.sha }}"

          # Sube a un directorio nuevo. El sitio en vivo no se toca todavía.
          ssh "$DESTINO" "mkdir -p '$RELEASE'"
          rsync -az --delete dist/ "$DESTINO:$RELEASE/"

          # Symlink atómico: `ln -sfn` + `mv` cambia el sitio en una sola
          # operación de filesystem. Nunca hay un instante con el sitio a medias.
          ssh "$DESTINO" "
            set -e
            ln -sfn '$RELEASE' '$RAIZ/actual.nuevo'
            mv -Tf '$RAIZ/actual.nuevo' '$RAIZ/actual'

            # Conserva las últimas 5 releases para poder volver atrás sin
            # reconstruir: un rollback debe ser un symlink, no un deploy.
            ls -1dt '$RAIZ'/releases/* | tail -n +6 | xargs -r rm -rf
          "

      - name: purgar caché de datos
        env:
          DESTINO: ${{ secrets.SSH_USUARIO }}@${{ secrets.SSH_HOST }}
        # Los assets llevan hash y son immutable a 1 año; /data/*.json se sirve
        # con 1 h de caché, así que el deploy lo purga explícitamente (§9).
        run: ssh "$DESTINO" "sudo nginx -s reload"
