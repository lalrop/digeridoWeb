# Nginx para digerido (§9).
#
# Se despliega con releases y symlink atómico: la raíz apunta a
# /var/www/digerido/actual, que el workflow mueve de golpe. Nginx sigue el
# symlink en cada request, así que un deploy no necesita reload para cambiar el
# contenido — el reload del workflow es solo para purgar la caché de /data/.
#
# Instalar:
#   sudo cp infra/nginx/digerido.conf /etc/nginx/sites-available/digerido
#   sudo ln -s /etc/nginx/sites-available/digerido /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Zona de caché para /data/: 1 h, purgada en cada deploy.
proxy_cache_path /var/cache/nginx/digerido levels=1:2 keys_zone=digerido_datos:10m
                 max_size=256m inactive=2h use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name digerido.cl www.digerido.cl;

    # Todo a HTTPS salvo el desafío de ACME.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://digerido.cl$request_uri;
    }
}

# www → sin www, en una sola redirección.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.digerido.cl;

    ssl_certificate     /etc/letsencrypt/live/digerido.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/digerido.cl/privkey.pem;

    return 301 https://digerido.cl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name digerido.cl;

    root /var/www/digerido/actual;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/digerido.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/digerido.cl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # ── Compresión (§9) ─────────────────────────────────────────────────────
    # Brotli primero; gzip como respaldo para clientes que no lo soportan.
    # Es la compresión con la que se mide el presupuesto de §8, así que si acá
    # se apaga, el presupuesto medido en CI deja de reflejar la realidad.
    brotli            on;
    brotli_comp_level 6;
    brotli_static     on;
    brotli_types      text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      application/rss+xml font/woff2;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      application/rss+xml;

    # ── Seguridad ───────────────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP: el sitio es estático y sin scripts de terceros salvo la analítica
    # autoalojada. `unsafe-inline` en style-src es necesario porque Astro emite
    # atributos style en las islas; no hay scripts inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://umami.digerido.cl; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://umami.digerido.cl; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ── Caché ───────────────────────────────────────────────────────────────

    # Assets con hash en el nombre: cambian de URL cuando cambian, así que
    # pueden ser immutable por un año sin riesgo de servir algo viejo.
    location /_assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Fuentes autoalojadas: mismo criterio, y CORS para que el navegador las
    # acepte desde un subdominio si algún día se sirve desde CDN.
    location /fuentes/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # Artefactos de datos: 1 h, con purga en deploy (§9). Se sirven con CORS
    # abierto a propósito: la idea es que otros los reutilicen.
    location /data/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        types {
            application/json  json;
            text/csv          csv;
            application/vnd.apache.arrow.file  arrow;
            application/vnd.apache.parquet     parquet;
        }
        default_type application/octet-stream;
    }

    # Imágenes OG: nombre estable, contenido que puede cambiar al reeditar una
    # pieza. Un día de caché con revalidación.
    location /og/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    }

    # HTML: siempre revalidado. Es lo que permite que una corrección aparezca
    # de inmediato (§13, log de correcciones público).
    location / {
        add_header Cache-Control "public, must-revalidate" always;
        # URLs con barra final; los directorios sirven su index.html.
        try_files $uri $uri/index.html $uri.html =404;
    }

    location = /rss.xml {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # El log de acceso no registra IP completa: la analítica es Umami sin
    # cookies (§9), y no hay razón para guardar más de lo necesario.
    log_format digerido '$remote_addr_anon - [$time_local] "$request" $status '
                        '$body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/digerido.access.log digerido;
    error_log  /var/log/nginx/digerido.error.log;
}

# Anonimiza el último octeto de la IP en los logs.
# Requiere el módulo realip o este map en el contexto http:
#
#   map $remote_addr $remote_addr_anon {
#       ~(?P<ip>\d+\.\d+\.\d+)\.    $ip.0;
#       ~(?P<ip>[^:]+:[^:]+):       $ip::;
#       default                     0.0.0.0;
#   }
