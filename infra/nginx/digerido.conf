# Nginx para digerido (§9).
#
# El sitio se sirve desde /var/www/digerido/actual, un symlink que el deploy
# mueve de golpe. Nginx lo sigue en cada request, así que un deploy no necesita
# reload para cambiar el contenido: el reload solo purga la caché de /data/.
#
# ─── NO editar a mano el dominio ────────────────────────────────────────────
# Este archivo usa el marcador DOMINIO. `infra/instalar-vps.sh` lo reemplaza por
# el dominio real al instalar. Si lo editás acá, el instalador lo sobrescribe.
#
# Los `include` de snippets existen porque tres cosas dependen de la versión y
# de los módulos del servidor, y ponerlas inline hace que Nginx no arranque:
#   · compresión: brotli necesita un módulo que no viene por defecto
#   · http2: la directiva cambió en nginx 1.25.1
#   · anonimización de IP: el `map` va en el contexto http, no acá
# El instalador genera los tres según lo que el servidor realmente soporte.

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO www.DOMINIO;

    # El desafío de ACME tiene que responder por HTTP: es como certbot renueva.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://DOMINIO$request_uri;
    }
}

# www → sin www, en una sola redirección.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    include snippets/digerido-http2.conf;
    server_name www.DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://DOMINIO$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    include snippets/digerido-http2.conf;
    server_name DOMINIO;

    root /var/www/digerido/actual;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Brotli si el módulo está; gzip siempre. Es la compresión con la que se mide
    # el presupuesto de §8, así que apagarla acá vuelve irreal ese presupuesto.
    include snippets/digerido-compresion.conf;

    # ── Seguridad ───────────────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP: sitio estático, sin scripts de terceros salvo la analítica
    # autoalojada. `unsafe-inline` en style-src es necesario porque Astro emite
    # atributos style en las islas; no hay scripts inline.
    #
    # Si Umami queda en otro host, cambiá las dos apariciones de UMAMI_HOST.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://UMAMI_HOST; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://UMAMI_HOST; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ── Caché ───────────────────────────────────────────────────────────────

    # Assets con hash en el nombre: cambian de URL cuando cambian, así que
    # pueden ser immutable por un año sin riesgo de servir algo viejo.
    location /_assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Fuentes autoalojadas: mismo criterio, más CORS por si algún día se sirven
    # desde un subdominio.
    location /fuentes/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # Artefactos de datos: 1 h, purgados en cada deploy (§9). CORS abierto a
    # propósito: la idea es que otros los reutilicen.
    location /data/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        # `types` reemplaza el mapa completo dentro de este location, así que
        # `default_type` cubre lo que no esté listado.
        types {
            application/json                   json;
            text/csv                           csv;
            application/vnd.apache.arrow.file  arrow;
            application/vnd.apache.parquet     parquet;
        }
        default_type application/octet-stream;
    }

    # Imágenes OG: nombre estable, contenido que puede cambiar al reeditar una
    # pieza. Un día, con revalidación.
    location /og/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    }

    location = /rss.xml {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # HTML: siempre revalidado. Es lo que hace que una corrección aparezca de
    # inmediato (§13, log de correcciones público).
    location / {
        add_header Cache-Control "public, must-revalidate" always;
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Astro genera 404.html desde src/pages/404.astro.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # El log no guarda la IP completa: la analítica es Umami sin cookies (§9) y
    # no hay razón para conservar más de lo necesario. `$remote_addr_anon` lo
    # define snippets/digerido-anonimizar-ip.conf, incluido en el contexto http.
    access_log /var/log/nginx/digerido.access.log digerido;
    error_log  /var/log/nginx/digerido.error.log;
}
