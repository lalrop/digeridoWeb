# Anonimización de IP en los logs (§9).
#
# Va en el contexto **http**, no dentro de un server: `map` y `log_format` solo
# son válidos ahí. El instalador lo incluye desde /etc/nginx/conf.d/, que Nginx
# carga dentro de http.
#
# Sin esto, `digerido.conf` referencia `$remote_addr_anon` en su `access_log` y
# Nginx se niega a arrancar con "unknown variable".

# IPv4: se descarta el último octeto. IPv6: se conservan los dos primeros grupos.
map $remote_addr $remote_addr_anon {
    ~(?P<ip>\d+\.\d+\.\d+)\.        $ip.0;
    ~(?P<ip>[^:]+:[^:]+):           $ip::;
    default                         0.0.0.0;
}

log_format digerido '$remote_addr_anon - [$time_local] "$request" $status '
                    '$body_bytes_sent "$http_referer" "$http_user_agent"';
